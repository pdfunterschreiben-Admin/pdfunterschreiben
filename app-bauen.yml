name: App bauen und veröffentlichen

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Neue Versionsnummer, z. B. 1.0.1 (muss höher sein als die letzte)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pakete installieren
        run: npm install

      - name: Bibliotheken und Versionsnummer in die App kopieren
        run: |
          mkdir -p www/lib
          cp index.html app.js style.css config.js www/
          cp icon/icon.svg www/logo.svg
          cp node_modules/@zxing/library/umd/index.min.js www/lib/zxing.min.js
          echo "window.APP_VERSION = \"${{ inputs.version }}\";" > www/version.js

      - name: Speicher-Zugang verschlüsselt einbauen
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: node verschluesseln.js

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          # Kamera-Berechtigung
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          # Versionsnummer
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${{ inputs.version }}\"/" android/app/build.gradle
          # Feste Signatur, damit Updates über die alte App installiert werden können
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KS_PATH"))
                      storePassword System.getenv("KS_PASS")
                      keyAlias System.getenv("KS_ALIAS")
                      keyPassword System.getenv("KS_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF
          # App-Logo, rundes Logo, adaptives Symbol und Startbildschirm
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin imagemagick >/dev/null
          R=android/app/src/main/res
          for e in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read d s f <<< "$e"
            mkdir -p $R/mipmap-$d
            rsvg-convert -w $s -h $s icon/icon.svg -o $R/mipmap-$d/ic_launcher.png
            rsvg-convert -w $s -h $s icon/round.svg -o $R/mipmap-$d/ic_launcher_round.png
            rsvg-convert -w $f -h $f icon/foreground.svg -o $R/mipmap-$d/ic_launcher_foreground.png
          done
          sed -i 's/#FFFFFF/#B8501F/I' $R/values/ic_launcher_background.xml
          rsvg-convert -w 1024 -h 1024 icon/icon.svg -o /tmp/logo.png
          for f in $(find $R -name splash.png); do
            dim=$(identify -format %wx%h $f); w=${dim%x*}; h=${dim#*x}; m=$(( (w<h?w:h) * 35 / 100 ))
            convert -size $dim xc:'#f6f3ee' \( /tmp/logo.png -resize ${m}x${m} \) -gravity center -composite $f
          done
          npx cap sync android
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: APK bauen
        env:
          KS_PATH: ${{ github.workspace }}/release.keystore
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: gewuerzregal
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Bestandsaufnahme.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Bestandsaufnahme ${{ inputs.version }}
          files: Bestandsaufnahme.apk
          make_latest: true
