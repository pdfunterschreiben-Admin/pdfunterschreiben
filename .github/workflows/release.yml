# Zwei Kanäle:
#  - TESTVERSION höher als VERSION  → Testversion (z. B. 1.13.0-test.7) ins Vorab-Release „adminkanal“.
#    Die bekommen nur Admins, die im Programm „Testversionen“ eingeschaltet haben.
#  - VERSION neu                     → fertige Version als normales Release für alle.
# Freigeben heißt: VERSION auf die getestete Nummer setzen.
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ["android/**", ".github/workflows/android.yml", "vorlagen/**", "pptx/**", ".github/workflows/pptx-release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kanal bestimmen
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STABLE="$(tr -d '[:space:]' < VERSION)"
          TEST="$(tr -d '[:space:]' < TESTVERSION 2>/dev/null || true)"
          higher() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]; }
          if ! gh release view "v$STABLE" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Fertige Version $STABLE wird veröffentlicht."
            echo "kind=stable" >> "$GITHUB_OUTPUT"
            echo "VERSION=$STABLE" >> "$GITHUB_ENV"
            echo "TAG=v$STABLE" >> "$GITHUB_ENV"
          elif [ -n "$TEST" ] && higher "$TEST" "$STABLE"; then
            V="$TEST-test.${GITHUB_RUN_NUMBER}"
            echo "Testversion $V wird veröffentlicht."
            echo "kind=test" >> "$GITHUB_OUTPUT"
            echo "VERSION=$V" >> "$GITHUB_ENV"
            echo "TAG=adminkanal" >> "$GITHUB_ENV"
          else
            echo "Nichts zu tun."
            echo "kind=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Hinweistext der fertigen Version leeren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STABLE="$(tr -d '[:space:]' < VERSION)"
          if gh release download "v$STABLE" -R "$GITHUB_REPOSITORY" -p version.json -O alt.json 2>/dev/null \
             && [ "$(jq -r '.notes // ""' alt.json)" != "" ]; then
            jq '.notes = ""' alt.json > version.json
            gh release upload "v$STABLE" version.json --clobber -R "$GITHUB_REPOSITORY"
            rm -f version.json
            echo "Hinweistext von $STABLE geleert."
          fi
          rm -f alt.json

      - uses: actions/setup-go@v5
        if: steps.ver.outputs.kind != 'none'
        with:
          go-version: "1.24"
          cache: false

      - name: pdf-lib mitliefern (damit das Programm offline speichern kann)
        if: steps.ver.outputs.kind != 'none'
        run: curl -fsSL -o web/lib/pdf-lib.min.js https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js

      - name: Programmsymbol in die exe einbauen
        if: steps.ver.outputs.kind != 'none'
        run: go run github.com/tc-hib/go-winres@v0.3.3 simply --icon assets/logo_256.png --arch amd64 --product-name "PDF Unterschreiben & Dokumentation" --file-description "PDF Unterschreiben & Dokumentation"

      - name: Bauen
        if: steps.ver.outputs.kind != 'none'
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          REPORT_URL: ${{ secrets.REPORT_URL }}
          REPORT_KEY: ${{ secrets.REPORT_KEY }}
        run: |
          # Leerzeichen/Zeilenumbrüche aus den Secrets entfernen (z. B. beim Einfügen mitkopiert)
          RU="$(printf '%s' "$REPORT_URL" | tr -d '[:space:]')"
          RK="$(printf '%s' "$REPORT_KEY" | tr -d '[:space:]')"
          # Programm und Updates liegen beim Konto pdfunterschreiben-Admin. Wird noch im alten
          # Repository gebaut, zeigt das Programm danach auf das neue Konto und den neuen Server.
          APP_OWNER=pdfunterschreiben-Admin
          APP_REPO=pdfunterschreiben
          if [ "$OWNER/$REPO" != "$APP_OWNER/$APP_REPO" ]; then
            RU="https://script.google.com/macros/s/AKfycbwj7l1K2RcGtPUu4wdRFjI7NLayzAtqjx0_XorzQmMNEqh-JyuEaOrUlOEN1BT9HVSC/exec"
          fi
          echo "Anmeldeserver gesetzt: $([ -n "$RU" ] && echo ja || echo nein), Schlüssel-Länge: ${#RK}, Ziel: $APP_OWNER/$APP_REPO"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -H=windowsgui -X main.Version=$VERSION -X main.RepoOwner=$APP_OWNER -X main.RepoName=$APP_REPO -X 'main.ReportURL=$RU' -X 'main.ReportKey=$RK'" \
            -o PDF-Unterschreiben-Setup.exe .

      - name: version.json schreiben
        if: steps.ver.outputs.kind != 'none'
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          # Kollegen sehen nur „Neue Version … ist da“ – der Änderungstext steht nur in Admin-Testversionen
          if [ "${{ steps.ver.outputs.kind }}" = "test" ]; then NOTES="$(git log -1 --format=%s "$GITHUB_SHA")"; else NOTES=""; fi
          SHA="$(sha256sum PDF-Unterschreiben-Setup.exe | cut -d' ' -f1)"
          URL="https://github.com/$OWNER/$REPO/releases/download/$TAG/PDF-Unterschreiben-Setup.exe"
          jq -n --arg v "$VERSION" --arg n "$NOTES" --arg u "$URL" --arg s "$SHA" \
            '{version:$v, notes:$n, url:$u, sha256:$s}' > version.json
          cat version.json

      - name: Fertige Version veröffentlichen
        if: steps.ver.outputs.kind == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # alter Testkanal (wurde von Version 1.12.2 auch für Firmen-Adressen abgefragt) – entfernen
          gh release delete testkanal -R "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" PDF-Unterschreiben-Setup.exe version.json --target "$GITHUB_SHA" --latest \
            --title "PDF Unterschreiben & Dokumentation $VERSION" --notes "$(git log -1 --format=%s "$GITHUB_SHA")"

      - name: Testversion veröffentlichen
        if: steps.ver.outputs.kind == 'test'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete adminkanal -R "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          git push origin ":refs/tags/adminkanal" 2>/dev/null || true
          gh release create adminkanal PDF-Unterschreiben-Setup.exe version.json --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "Testversion $VERSION (nur Admin)" --notes "$(git log -1 --format=%s "$GITHUB_SHA")"
